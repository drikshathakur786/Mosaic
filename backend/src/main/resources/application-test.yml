# =============================================================================
# Mosaic Backend — Test Profile
# =============================================================================
# Automatically activated during test runs.
# Uses H2 in-memory database for fast, isolated tests.
# =============================================================================

spring:
  datasource:
    url: jdbc:h2:mem:mosaic_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop                       # Auto-create schema for tests
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false                                # Schema managed by Hibernate in tests

logging:
  level:
    root: WARN
    com.mosaic: DEBUG

mosaic:
  jwt:
    secret: test-secret-key-that-is-at-least-256-bits-long-for-hmac-sha256-algorithm
    access-token-expiry-ms: 900000
    refresh-token-expiry-ms: 604800000
